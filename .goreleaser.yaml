version: 2

project_name: expose

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/expose
    binary: expose
    ldflags:
      - -s -w -X github.com/kernelshard/expose/internal/version.Version={{.Version}} -X github.com/kernelshard/expose/internal/version.GitCommit={{.Commit}} -X github.com/kernelshard/expose/internal/version.BuildDate={{.Date}}

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      format: zip

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  - repository:
      owner: kernelshard
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://kernelshard.github.io/expose/"
    description: "The open-source, pure Go alternative to ngrok."
    license: "Apache-2.0"
    install: |
      bin.install "expose"
    test: |
      system "#{bin}/expose --version"
