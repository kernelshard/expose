site_name: Expose
site_description: The open-source, single-binary alternative to ngrok. Expose local ports via LocalTunnel, Cloudflare, or a self-hosted server — zero signup required.
site_author: kernelshard
site_url: https://kernelshard.github.io/expose/

repo_name: kernelshard/expose
repo_url: https://github.com/kernelshard/expose
edit_uri: edit/main/docs/

docs_dir: docs
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/images/logo.svg
  favicon: assets/images/favicon.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - announce.dismiss

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
  - Home: index.md
  - Getting Started: GETTING_STARTED.md
  - Self-Hosted: SELF_HOSTED.md
  - Guides:
      - How Tunnels Work: TUTORIAL.md
      - Advanced Usage: ADVANCED_USAGE.md
  - Architecture: ARCHITECTURE.md
  - Contributing:
      - Onboarding: ONBOARDING.md
      - Contributing Guide: CONTRIBUTING.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kernelshard/expose
      name: Expose on GitHub
  generator: false

extra_css:
  - stylesheets/custom.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.critic
  - admonition
  - toc:
      permalink: true
      title: On this page
  - attr_list
  - md_in_html
  - def_list
  - tables
  - footnotes
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
